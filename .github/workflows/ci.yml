name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pure-Rust library builds and its tests pass on every platform. There is no
  # C toolchain, build script, or dependency involved, so this also guards against
  # platform-specific regressions. The lossless round-trip tests (encode -> decode ->
  # PCM, MD5-verified, all depths/levels) live here; byte-exactness vs the C
  # reference is the `oracle` job below.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Byte-exactness against the C reference: the `oracle/` crate compiles libFLAC
  # 1.5.0 + libogg 1.3.5 (fetched from the Xiph tags) and diffs complete outputs
  # through the public API. Both sides use the platform libm (cosf, log), whose
  # last-bit rounding differs between C libraries, so the oracle runs once per
  # libm: glibc here, musl in `oracle-musl`.
  oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oracle
      - run: ./fetch-sources.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The oracle on musl, in an Alpine container started from the Ubuntu runner
  # (JavaScript actions such as checkout stay on the glibc host).
  oracle-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: oracle/fetch-sources.sh
      - name: cargo test (rust:alpine, musl)
        run: >-
          docker run --rm -v "$PWD":/src -w /src/oracle rust:alpine
          sh -c 'apk add -q --no-cache gcc musl-dev && cargo test --locked'
