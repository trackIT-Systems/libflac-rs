name: Release

# Releases are GitHub releases of an existing tag. This fork does not publish to
# crates.io: the `libflac-rs` name there belongs to upstream (`publish = false` in
# Cargo.toml).
#
# Flow: bump the version in Cargo.toml, add its CHANGELOG.md section, tag the
# commit (vX.Y.Z) and push the tag, then dispatch this workflow with the tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.150.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.toml version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --locked

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          awk -v h="## ${TAG#v}" 'index($0, h) == 1 {f = 1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
