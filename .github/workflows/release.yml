name: Release

# Releases are GitHub releases of an existing tag. This fork does not publish to
# crates.io: the `libflac-rs` name there belongs to upstream (`publish = false` in
# Cargo.toml).
#
# Flow: bump the version in Cargo.toml, add its CHANGELOG.md section, tag the
# commit (vX.Y.Z) and push the tag; pushing it creates the release. To retry for
# an existing tag, dispatch this workflow with the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.150.1'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Verify Cargo.toml version matches the tag
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo test --locked

      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v h="## ${TAG#v}" 'index($0, h) == 1 {f = 1; next} /^## / && f {exit} f' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
